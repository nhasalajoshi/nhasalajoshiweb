# One entry per project. Edit this file to add real details, links, and images.
# pillar: primary pillar id (community, inclusion, data, governance). also: secondary pillar ids.
# featured: true shows the project on the home page (keep it to four, one per pillar).
# image: path to a file in /assets/img/ (add image_alt too). Empty shows a placeholder.
# links: list of { label, url }. Do not link to pages that show funder logos or names.
# blurb: one short line for the home page cards (falls back to summary if empty).
# verified: false shows a "Check" flag while show_draft_flags is on in _config.yml.

- id: wlit-fellowship
  title: WLiT Fellowship
  pillar: community
  also: [inclusion]
  role: Designed and directed
  org: Women Leaders in Technology (WLiT)
  years: 2015 to present
  featured: true
  verified: true
  summary: A flagship fellowship that builds technical and leadership skills in young women studying computing, through bootcamps, mentoring, and community projects.
  blurb: Technical and leadership skills for young women in computing.
  problem: Women are scarce in technology leadership in Nepal, and few young women see a path from a computing degree to a leadership role.
  approach: A year-long fellowship that pairs technical training with leadership development, mentoring, and a supportive community, run across more than one city.
  result: 14 fellowship cohorts and a community of more than 200 women tech professionals.
  image: ""
  image_alt: ""
  links: []

