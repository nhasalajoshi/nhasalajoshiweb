{% assign pil = include.pillar %}
<li class="tile p-{{ pil.id }}{% if pil.featured %} tile--lead{% endif %}">
  <a href="{{ pil.url | relative_url }}">
    <span class="icon-bubble">{% include icon.html name=pil.id %}</span>
    <div class="tile__text">
      <h3>{{ pil.name }}</h3>
      <span class="tile__line">{{ pil.line }}</span>
    </div>
    <span class="tile__go" aria-hidden="true">{% include icon.html name="arrow" %}</span>
  </a>
</li>
